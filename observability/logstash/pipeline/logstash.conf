# Filebeat envía los logs de todos los contenedores Docker -> Logstash -> Elasticsearch (Kibana los visualiza).
input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => { "servicio" => "%{[container][name]}" }
  }
  mutate {
    gsub => [ "servicio", "^savefrut-", "" ]
  }
  # Extrae el nivel de log de las líneas de Spring Boot (ej. "2026-10-24T23:13:18.907Z  INFO 1 --- [ms-identidad] ...")
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:nivel}" }
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "savefrut-logs-%{+YYYY.MM.dd}"
  }
}
