# ── Servidor ──
server.port=${SERVER_PORT:8091}

# ── Base de datos PostgreSQL (Dinámica para Docker/Local desde .env) ──
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_savefrut}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Configuración JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Seguridad JWT (desde .env) ──
app.jwt.secret=${JWT_SECRET:VB0zhjjydLvSTJXNDV306NX3ARYYEHf24AcmRKwP62tBvzs8saPVlh18/2fZfQILo4i08au5yn+uCwGUzdf93A==}
app.jwt.access.expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:30}
app.jwt.refresh.expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ── Redis ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Integraciones (desde .env) ──
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:TEST-28863975135671-112218-2bd0d6cf5a1469ed4e5bc99c22543d6e-468857567}
mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY:TEST-0769b212-5d60-4c21-a825-0a153400f01e}
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# ── URLs Placeholder para Imágenes ──
app.image.placeholder-url=https://placehold.co/400x400/cccccc/999999?text=Sin+Imagen

# ── Logs (Para que veas qué pasa en la consola de Docker) ──
logging.level.com.savefrut.api=DEBUG
logging.level.org.springframework.security=INFO