spring.application.name=savefrut-api

# ── Configuración de Base de Datos (DINÁMICA desde .env) ──
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate & JPA ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── JWT Custom (desde .env) ──
app.jwt.secret=${JWT_SECRET}
app.jwt.access.expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES}
app.jwt.refresh.expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}

# ── Mercado Pago (desde .env) ──
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY}

# ── Google Maps API (desde .env) ──
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# ── Servidor ──
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${SERVER_PORT:8091}

# ── Redis (DINÁMICO desde .env) ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Configuración de URLs Placeholder para Imágenes ──
app.image.placeholder-url=https://placehold.co/400x400/cccccc/999999?text=Sin+Imagen
