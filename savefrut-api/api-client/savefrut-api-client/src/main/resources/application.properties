spring.application.name=savefrut-api

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Custom
app.jwt.secret=${JWT_SECRET}
app.jwt.access.expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES}
app.jwt.refresh.expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}

# Mercado Pago
app.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN}
app.mercadopago.public-key=${MERCADO_PAGO_PUBLIC_KEY}

# Profile & Port
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${SERVER_PORT:8091}
