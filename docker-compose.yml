
services:

  # ── 1. Base de Datos (PostgreSQL) ───────────────────────────────────────────
  postgres:
    container_name: savefrut_db
    image: postgres:16-alpine
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/db_savefrut
      POSTGRES_DB: db_savefrut
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-123456}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ejecución automática de tu script inicial
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d db_savefrut"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Caché (Redis) ──────────────────────────────────────────────────────────
  redis:
    container_name: savefrut_redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Aplicación Backend (Spring Boot) ───────────────────────────────────────
  api:
    container_name: savefrut_api
    build:
      context: .  # Apunta a la raíz donde movimos el Dockerfile
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      # Conexión apuntando al contenedor de PostgreSQL
      DB_URL: jdbc:postgresql://postgres:5432/db_savefrut
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-123456}
      JWT_SECRET: ${JWT_SECRET:-your_secret_key_min_32_chars_long!!!}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-TEST}
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY:-TEST}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVER_PORT: ${SERVER_PORT:-8091}
    ports:
      - "${SERVER_PORT:-8091}:${SERVER_PORT:-8091}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-8091}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── 4. Declaración de Volúmenes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data: