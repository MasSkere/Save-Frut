<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Pago - Savefrut</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://js.stripe.com/v3/"></script>

  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] },
          colors: { savefrut: "#16a34a" },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-100 font-sans">
  <!-- HEADER -->
  <header class="container mx-auto px-4 py-5 flex justify-between items-center bg-white border-b">
    <a href="index.html" class="text-2xl font-bold text-savefrut">Savefrut</a>
    <div class="flex items-center space-x-2 text-sm text-gray-500">
      <a href="carrito.html" class="hover:text-savefrut">Carrito</a>
      <i data-feather="chevron-right" class="w-4 h-4"></i>
      <a href="envio.html" class="hover:text-savefrut">Envío</a>
      <i data-feather="chevron-right" class="w-4 h-4"></i>
      <span class="font-semibold text-savefrut">Pago</span>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
    <!-- COLUMNA IZQUIERDA -->
    <div class="lg:col-span-2 space-y-6">
      <h1 class="text-3xl font-bold text-gray-800">Selecciona tu método de pago</h1>

      <!-- OPCIONES DE PAGO -->
      <div class="bg-white rounded-lg shadow-md border p-6 space-y-4">
        <label class="flex items-center cursor-pointer">
          <input type="radio" name="metodo-pago" id="radio-stripe" class="h-5 w-5 text-savefrut" checked />
          <span class="ml-3 text-lg font-semibold text-gray-800">Pagar con tarjeta (Stripe)</span>
        </label>

        <label class="flex items-center cursor-pointer">
          <input type="radio" name="metodo-pago" id="radio-efectivo" class="h-5 w-5 text-savefrut" />
          <span class="ml-3 text-lg font-semibold text-gray-800">Pagar contra entrega</span>
        </label>
      </div>

      <!-- FORMULARIO STRIPE -->
      <div id="stripe-section" class="bg-white rounded-lg shadow-md border p-6">
        <h2 class="text-xl font-bold text-gray-700 mb-4">Pago con tarjeta</h2>
        <form id="payment-form">
          <div id="payment-element" class="mb-6"></div>

          <button id="submit-button" class="w-full bg-savefrut text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors">
            <span id="button-text">Pagar Ahora</span>
            <span id="spinner" class="hidden">Procesando...</span>
          </button>

          <div id="payment-message" class="hidden text-red-500 text-sm mt-4 text-center"></div>
        </form>
      </div>

      <!-- BOTÓN CONFIRMAR CONTRA ENTREGA -->
      <div id="efectivo-section" class="hidden bg-white rounded-lg shadow-md border p-6 text-center">
        <h2 class="text-xl font-bold text-gray-700 mb-4">Pago contra entrega</h2>
        <p class="text-gray-500 mb-4">Pagarás al recibir tu pedido (efectivo o Yape/Plin).</p>
        <button id="payment-button" class="w-full bg-savefrut text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors">
          Confirmar Pedido
        </button>
      </div>
    </div>

    <!-- RESUMEN -->
    <div class="lg:col-span-1 h-fit bg-white rounded-lg shadow-md border p-6 sticky top-8">
      <h2 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-4">Resumen del Pedido</h2>
      <div class="space-y-3 text-gray-700">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="summary-subtotal" class="font-medium">S/ 0.00</span>
        </div>
        <div id="variety-fee-row" class="hidden flex justify-between">
          <span class="text-orange-600">Tarifa por Variedad</span>
          <span id="summary-variety-fee" class="font-medium text-orange-600">S/ 0.00</span>
        </div>
        <div class="flex justify-between">
          <span>Envío</span>
          <span id="summary-shipping" class="font-medium">S/ 0.00</span>
        </div>
        <div class="border-t pt-4 mt-4 flex justify-between text-xl font-bold text-gray-900">
          <span>Total</span>
          <span id="summary-total">S/ 0.00</span>
        </div>
      </div>
    </div>
  </main>

  <script src="js/services/cart-service.js"></script>
  <script src="js/pago.js"></script>
  <script>feather.replace();</script>
</body>
</html>
