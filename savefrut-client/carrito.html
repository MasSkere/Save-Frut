<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito - Savefrut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { 'sans': ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-100">

    <header class="container mx-auto px-4 py-5 flex justify-between items-center bg-white border-b">
        <a href="index.html" class="text-2xl font-bold text-green-600">Savefrut</a>
        <a href="index.html" class="text-sm text-gray-600 hover:text-green-600">← Seguir Comprando</a>
    </header>

    <main class="container mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 bg-white rounded-lg shadow-md border p-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-6" id="cart-title">Tu Carrito (0 items)</h1>
            
            <div id="cart-items-container" class="divide-y divide-gray-200">
                <div id="empty-cart-message" class="text-center py-12">
                    <p class="text-gray-500">Tu carrito está vacío.</p>
                </div>
            </div>
        </div>

        <div class="lg:col-span-1 h-fit bg-white rounded-lg shadow-md border p-6 sticky top-8">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-4 mb-4">Resumen del Pedido</h2>
            
            <div class="space-y-3 text-gray-700">
                <div class="flex justify-between">
                    <span>Subtotal</span>
                    <span id="summary-subtotal" class="font-medium">S/ 0.00</span>
                </div>
                
                <div id="variety-fee-row" class="hidden flex justify-between text-orange-600">
                    <span>Tarifa por Variedad</span>
                    <span id="summary-variety-fee" class="font-medium">S/ 5.00</span>
                </div>
                           
                <div class="border-t pt-4 mt-4 flex justify-between text-xl font-bold text-gray-900">
                    <span>Total</span>
                    <span id="summary-total">S/ 0.00</span>
                </div>
            </div>
            
            <button id="checkout-button" class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors mt-6">
                Elegir Método de Envío
            </button>
            <a href="index.html" class="w-full text-center text-sm text-gray-600 hover:text-green-600 mt-4 inline-block">
                Volver a la tienda
            </a>
        </div>
    </main>

    <script src="js/carrito.js"></script>
    <script>
      feather.replace();
    </script>
</body>
</html>
