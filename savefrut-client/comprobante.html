<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pedido - Savefrut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { 'sans': ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <main class="container mx-auto mt-12 mb-12 px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md border p-8">
            
            <div id="comprobante-contenido">
                <div class="flex justify-between items-center border-b pb-6 mb-6">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800">¡Gracias por tu compra!</h1>
                        <p class="text-gray-500">Tu pedido ha sido confirmado.</p>
                    </div>
                    <span class="text-2xl font-bold text-green-600">Savefrut</span>
                </div>

                <div class="grid grid-cols-2 gap-4 text-sm mb-8">
                    <div>
                        <h3 class="font-semibold text-gray-500 uppercase tracking-wide">Facturado a:</h3>
                        <p id="cliente-nombre" class="font-medium text-gray-800">Ronal Martínez</p>
                        <p id="cliente-email" class="text-gray-600">ronal@savefrut.com</p>
                    </div>
                    <div class="text-right">
                        <h3 class="font-semibold text-gray-500 uppercase tracking-wide">N° de Pedido</h3>
                        <p id="orden-id" class="font-medium text-gray-800">#000000</p>
                        <h3 class="font-semibold text-gray-500 uppercase tracking-wide mt-2">Fecha</h3>
                        <p id="orden-fecha" class="font-medium text-gray-800">03 Nov, 2025</p>
                    </div>
                </div>

                <h2 class="text-xl font-semibold text-gray-800 mb-4">Resumen del Pedido</h2>
                
                <div id="items-container" class="divide-y divide-gray-200 border-b">
                    </div>
                
                <div class="mt-6 ml-auto w-full max-w-xs text-sm">
                    <div class="space-y-2">
                        <div class="flex justify-between text-gray-700">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="font-medium">S/ 0.00</span>
                        </div>
                        <div id="variety-fee-row" class="flex justify-between text-gray-700">
                            <span>Tarifa por Variedad</span>
                            <span id="summary-variety-fee" class="font-medium">S/ 0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-700">
                            <span>Envío</span>
                            <span id="summary-shipping" class="font-medium">S/ 0.00</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold text-gray-900 border-t pt-2 mt-2">
                            <span>Total Pagado</span>
                            <span id="summary-total">S/ 0.00</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between mt-8">
                <a href="index.html" class="text-sm text-green-600 font-medium hover:underline">
                    ← Volver a la tienda
                </a>
                <button id="download-pdf-btn" class="bg-gray-800 text-white py-2 px-4 rounded-lg font-medium hover:bg-gray-700">
                    <i data-feather="download" class="w-4 h-4 inline-block -mt-1 mr-2"></i>
                    Descargar PDF
                </button>
            </div>
        </div>
    </main>

    <script src="js/services/cart-service.js"></script> <script src="js/comprobante.js"></script>
    <script>
      feather.replace();
    </script>
</body>
</html>
