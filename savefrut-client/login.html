<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Savefrut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-50">

    <header class="container mx-auto px-4 py-5 flex justify-between items-center border-b bg-white">
        <a href="index.html" class="text-2xl font-bold text-green-600">Savefrut</a>
        <a href="index.html" class="text-sm text-gray-600 hover:text-green-600">Volver al inicio</a>
    </header>

    <main class="container mx-auto mt-12 px-4 flex justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md border w-full max-w-md">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h1>
            
            <form id="login-form">
                
                <div id="error-message" class="text-red-500 text-sm mb-4"></div>
                
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Correo Electrónico</label>
                    <input type="email" id="email-input" name="email" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="tu@correo.com" required>
                </div>
                
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <input type="password" id="password-input" name="password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                           placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="login-button" 
                        class="w-full bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition-colors">
                    Ingresar
                </button>
            </form>
            
            <p class="text-center text-sm text-gray-600 mt-6">
                ¿No tienes una cuenta? <a href="#" class="text-green-600 font-medium hover:underline">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
