<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Savefrut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Configuración de Tailwind para usar la fuente "Inter"
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="container mx-auto px-4 py-5 flex justify-between items-center border-b bg-white">
        <a href="index.html" class="text-2xl font-bold text-green-600">Savefrut</a>
        <div class="flex items-center space-x-5">
            <a href="#" class="text-gray-600 hover:text-green-600">
                <i data-feather="search" class="w-5 h-5"></i>
            </a>
            <a href="carrito.html" class="text-gray-600 hover:text-green-600 relative">
                <i data-feather="shopping-cart" class="w-5 h-5"></i>
                <span id="carrito-contador" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-4 w-4 flex items-center justify-center">0</span>
            </a>
            <a href="login.html" class="bg-green-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-green-700 transition-colors">
                Mi Perfil
            </a>
        </div>
    </header>

    <main class="container mx-auto mt-8 px-4">

        <h1 id="tienda-titulo" class="text-3xl font-bold text-gray-800 mb-6">
            Cargando tienda...
        </h1>
        
        <div id="productos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <footer class="text-center text-gray-500 text-sm mt-12 py-6 border-t bg-white">
        <div class="container mx-auto space-x-4">
            <a href="#" class="hover:text-black">Sobre Nosotros</a>
            <a href="#" class="hover:text-black">Contacto</a>
            <a href="#" class="hover:text-black">Términos y Condiciones</a>
        </div>
        <p class="mt-4">© 2025 Savefrut. Todos los derechos reservados.</p>
    </footer>

    <script src="js/tienda.js"></script>
    
    <script>
      feather.replace();
    </script>
</body>
</html>
