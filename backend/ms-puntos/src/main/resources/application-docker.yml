server:
  port: 8084

spring:
  application:
    name: ms-puntos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-puntos:5432/bd_puntos}
    username: ${SPRING_DATASOURCE_USERNAME:savefrut_user}
    password: ${SPRING_DATASOURCE_PASSWORD:savefrut_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:savefrut}
    password: ${SPRING_RABBITMQ_PASSWORD:savefrut}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

jwt:
  secret: ${JWT_SECRET}

feign:
  client:
    ms-identidad:
      url: ${FEIGN_CLIENT_MS_IDENTIDAD_URL:http://ms-identidad:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}
