server:
  port: 8084

spring:
  application:
    name: ms-puntos
  datasource:
    url: jdbc:postgresql://localhost:5435/bd_ordenes
    username: savefrut_user
    password: savefrut_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: savefrut
    password: savefrut

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
