server:
  port: 8081

spring:
  application:
    name: ms-identidad

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-identidad:5432/bd_identidad}
    username: ${SPRING_DATASOURCE_USERNAME:savefrut_user}
    password: ${SPRING_DATASOURCE_PASSWORD:savefrut_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-this-in-prod-very-long-secret-key-change-this-in-prod-very-long-secret-key}
  access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}
