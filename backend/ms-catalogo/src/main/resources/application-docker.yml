server:
  port: 8082

spring:
  application:
    name: ms-catalogo
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-catalogo:5432/bd_catalogo}
    username: ${SPRING_DATASOURCE_USERNAME:savefrut_user}
    password: ${SPRING_DATASOURCE_PASSWORD:savefrut_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET}

feign:
  client:
    ms-identidad:
      url: ${FEIGN_CLIENT_MS_IDENTIDAD_URL:http://ms-identidad:8081}
