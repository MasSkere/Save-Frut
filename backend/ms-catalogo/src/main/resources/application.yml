server:
  port: 8082

spring:
  application:
    name: ms-catalogo
  datasource:
    url: jdbc:postgresql://localhost:5434/bd_catalogo
    username: savefrut_user
    password: savefrut_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

jwt:
  secret: savefrut-super-secret-key-2025-savefrut-super-secret-key-2025

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
