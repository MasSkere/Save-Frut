@let p = producto();
<article class="relative bg-surface-card rounded-card shadow-soft overflow-hidden flex flex-col tarjeta has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-brand-500">
  <div class="relative aspect-[4/3] sm:aspect-square">
    <app-product-image class="absolute inset-0" [url]="p.imagenUrl" [nombre]="p.nombre" [categoria]="p.nombreCategoria" [decorativo]="true" />
    <span class="absolute top-2 left-2 text-xs font-semibold px-2 py-1 rounded-button" [class]="claseUrgencia()">
      {{ etiqueta() }}
    </span>
    <span class="absolute top-2 right-2 bg-brand-500 text-white text-xs font-bold px-2 py-1 rounded-button cifra">
      -{{ descuento() }}%
    </span>
  </div>

  <div class="flex flex-col flex-1 p-3 sm:p-4">
    <h3 class="text-[0.95rem] font-semibold text-gray-900 leading-snug line-clamp-2">
      <a [routerLink]="['/productos', p.id]" class="after:absolute after:inset-0 focus-visible:outline-none">{{ p.nombre }}</a>
    </h3>
    <p class="mt-1 text-xs text-gray-600 truncate">{{ p.nombreVendedor }}</p>

    <div class="mt-auto pt-3 flex items-end justify-between gap-2">
      <div class="min-w-0">
        <p class="font-display text-xl font-bold text-brand-600 leading-none cifra">{{ p.precioDescuento | currencyPEN }}</p>
        <p class="mt-1 text-xs text-gray-500 cifra">
          <span class="line-through">{{ p.precioNormal | currencyPEN }}</span> · {{ p.nombreMedicion }}
        </p>
      </div>
      <button type="button" (click)="agregar()" class="btn-quiet relative z-10 shrink-0"
              [attr.aria-label]="'Agregar ' + p.nombre + ' al carrito'">
        <app-icon nombre="plus" [tamano]="16" [trazo]="2.25" />
        <span class="hidden sm:inline">Agregar</span>
      </button>
    </div>
  </div>
</article>
