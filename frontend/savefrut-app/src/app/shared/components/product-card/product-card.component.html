@let p = producto();
<article class="bg-surface-card rounded-card shadow-soft overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col">
  <a [routerLink]="['/productos', p.id]" class="block">
    <div class="relative aspect-square overflow-hidden bg-gray-100">
      <img [src]="p.imagenUrl" [alt]="p.nombre" class="w-full h-full object-cover" loading="lazy" />
      <span class="absolute top-2 right-2 bg-brand-500 text-white text-xs font-bold px-2 py-1 rounded-button">
        -{{ descuento() }}%
      </span>
      <span class="absolute top-2 left-2 text-xs font-semibold px-2 py-1 rounded-button" [class]="claseUrgencia()">
        {{ etiqueta() }}
      </span>
    </div>
    <div class="p-3">
      <span class="text-xs text-brand-400 uppercase tracking-wide">{{ p.nombreCategoria }}</span>
      <h2 class="text-sm font-medium text-gray-900 mt-1 line-clamp-2">{{ p.nombre }}</h2>
      <div class="mt-2 flex items-baseline gap-2">
        <span class="text-lg font-bold text-brand-600">{{ p.precioDescuento | currencyPEN }}</span>
        <span class="text-xs text-gray-400 line-through">{{ p.precioNormal | currencyPEN }}</span>
      </div>
      <div class="mt-1 text-xs text-gray-500 flex justify-between gap-2">
        <span>por {{ p.nombreMedicion }}</span>
        <span class="truncate">{{ p.nombreVendedor }}</span>
      </div>
    </div>
  </a>
  <div class="px-3 pb-3 mt-auto">
    <button
      type="button"
      (click)="agregar()"
      class="w-full flex items-center justify-center gap-1 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-button transition-colors text-sm font-medium"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      Agregar
    </button>
  </div>
</article>
