<main class="min-h-screen bg-brand-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-surface-card rounded-card shadow-soft p-8">
      <div class="text-center mb-8">
        <a routerLink="/" class="inline-flex mb-5 rounded-full" aria-label="SaveFrut, ir al inicio"><app-logo [tamano]="56" [conTexto]="false" /></a>
        <h1 class="text-2xl font-bold text-brand-700">Ingresa a SaveFrut</h1>
        <p class="text-gray-500 mt-1 text-sm">Salva frutas, ahorra dinero</p>
      </div>

      <form (ngSubmit)="onSubmit()" #f="ngForm" class="space-y-5">
        @if (aviso()) {
          <div class="bg-brand-50 border border-brand-200 text-brand-700 text-sm rounded-button p-3 text-center">{{ aviso() }}</div>
        }
        @if (error()) {
          <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-button p-3 text-center" role="alert">{{ error() }}</div>
        }

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input id="email" name="email" type="email" required email [(ngModel)]="email" autocomplete="email"
                 placeholder="tu@email.com"
                 class="w-full px-4 py-3 border border-surface-border rounded-button focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input id="password" name="password" type="password" required [(ngModel)]="password" autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full px-4 py-3 border border-surface-border rounded-button focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </div>

        <button type="submit" [disabled]="loading() || f.invalid"
                class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-3 rounded-button transition-colors disabled:opacity-50">
          {{ loading() ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="mt-6 text-center text-gray-600 text-sm">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="text-brand-500 hover:text-brand-600 font-medium">Regístrate</a>
      </p>
    </div>

    <details class="mt-4 bg-surface-card rounded-card shadow-soft p-4 text-sm text-gray-600">
      <summary class="cursor-pointer font-medium text-brand-700">Cuentas de demostración</summary>
      <ul class="mt-2 space-y-1 font-mono text-xs">
        <li>Cliente: ronal&#64;savefrut.com / 789456</li>
        <li>Vendedor: jplopez&#64;savefrut.com / 123456</li>
        <li>Admin: admin&#64;savefrut.com / admin</li>
      </ul>
    </details>
  </div>
</main>
